<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact - Skyline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Sky<span>line</span></a>
    <ul class="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="weather.html">Weather</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="page">
      <p class="eyebrow">Get in touch</p>
      <h1>Contact Us</h1>
      <p>Have feedback or found a bug? Send us a message below.</p>

      <form class="contactForm" onsubmit="submitContact(event)">
        <input type="text" id="nameField" placeholder="Your name" required>
        <input type="email" id="emailField" placeholder="Your email" required>
        <textarea id="messageField" placeholder="Your message" required></textarea>
        <button type="submit">Send Message</button>
        <p class="formNote" id="formNote"></p>
      </form>
    </div>
  </main>

  <footer>&copy; 2026 Skyline Weather. Built as a college project.</footer>

  <script src="contact.js"></script>
</body>
</html>
