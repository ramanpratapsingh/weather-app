<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather - Skyline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Sky<span>line</span></a>
    <ul class="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="weather.html" class="active">Weather</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="wrap">
      <div class="box">
        <p class="eyebrow">Skyline</p>
        <h1>Weather</h1>

        <div class="searchRow">
          <input type="text" id="cityInput" placeholder="Search a city...">
          <button onclick="getWeather()">Go</button>
        </div>

        <div id="result">
          <p class="placeholder">Search for a city to see the weather</p>
        </div>
      </div>

      <div class="history">
        <p class="eyebrow">Recent</p>
        <ul id="historyList"></ul>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 Skyline Weather. Built as a college project.</footer>

  <script src="script.js"></script>
</body>
</html>
